<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Specter">
  <title>Specter</title>
  <!-- Flat square, no rounded corners: iOS applies its own squircle mask. -->
  <rect width="120" height="120" fill="#0a0a0c"/>
  <g fill="#f5f5f5">
    <rect x="26" y="30" width="68" height="6" rx="3"/>
    <rect x="30" y="45" width="60" height="6" rx="3" opacity=".92"/>
    <rect x="35" y="60" width="50" height="6" rx="3" opacity=".84"/>
    <rect x="41" y="75" width="38" height="6" rx="3" opacity=".76"/>
  </g>
  <circle cx="60" cy="97" r="5" fill="#0095f6"/>
</svg>
